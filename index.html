<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ratland Defense</title>
<style>
  :root { color-scheme: dark; }
  /* Phase 53: the page is an app, not a document — js/fit.js scales the body
     down to fit smaller windows, and the (unscaled) layout box must not
     produce scrollbars while it does. Harmless at scale 1. */
  html { overflow: hidden; }
  body { margin: 0; background: #14171c; color: #dfe6ee;
         font-family: system-ui, sans-serif; display: flex;
         flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
  #hud { display: flex; gap: 18px; align-items: center; font-size: 15px; }
  #hud b { color: #ffd76a; }
  #wrap { display: flex; gap: 10px; }
  /* align-self:flex-start keeps the canvas at its intrinsic 1400×800 — the
     flex row's default (align-items:stretch) would otherwise stretch the
     canvas TALLER whenever the shop grows the row's height, so the playfield
     visibly "grows". The row may still grow; the canvas stays pinned to its
     top edge, unmoved and unscaled. Phase 64: #towerPanel moved OUT of this
     row into a constant-height bar below the message, so selecting a tower
     no longer changes the page's layout size (no fit.js rescale). */
  canvas { background: #1d232c; border: 1px solid #2c3440; image-rendering: pixelated; align-self: flex-start; }
  #legend { width: 190px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .legend-item { background: #232a35; border: 1px solid #39424f; border-radius: 6px;
    padding: 6px 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .legend-item .swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .legend-item .desc { width: 100%; }
  /* Enemy types not active on the current map are greyed out. */
  .legend-item.inactive { opacity: .38; }
  #side { width: 210px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
  .shop-item, .tower-btn { background: #232a35; border: 1px solid #39424f;
    color: #dfe6ee; padding: 7px 9px; border-radius: 6px; cursor: pointer; text-align: left; }
  /* Buttons are inline-block by default, so each sized to its own content —
     make the sidebar ones block-level so every box fills the column width,
     matching the uniform enemy legend boxes on the left. Scoped here because
     .tower-btn is also used in the top HUD bar, where buttons stay inline. */
  #shop .shop-item { display: block; width: 100%; box-sizing: border-box; }
  .shop-item:hover, .tower-btn:hover { background: #2c3543; }
  .shop-item.selected { outline: 2px solid #ffd76a; }
  .shop-item:disabled, .tower-btn:disabled { opacity: .45; cursor: default; }
  .name { font-weight: 600; }
  .cost { color: #ffd76a; float: right; }
  .desc { color: #8b97a7; font-size: 11px; margin-top: 2px; }
  /* Phase 64: the tower-detail bar — a CONSTANT-HEIGHT full-width row between
     the message and the stats bar. Always visible (placeholder when nothing
     is selected), so selecting/deselecting a tower never changes the page's
     layout size and fit.js never rescales the canvas. Content is one
     horizontal line: head block, dropdowns, Upgrade/Sell. */
  #towerPanel { display: flex; gap: 8px; align-items: center; justify-content: flex-end;
    flex-wrap: nowrap; background: #232a35; border: 1px solid #39424f; border-radius: 6px;
    padding: 4px 8px; font-size: 12px; width: 100%; box-sizing: border-box; height: 36px; }
  #towerPanel .tp-head { display: inline-flex; gap: 8px; align-items: center;
    font-size: 13px; white-space: nowrap; }
  #towerPanel .tp-head .desc { margin-top: 0; }
  #towerPanel .tp-placeholder { color: #8b97a7; font-size: 13px; }
  /* Phase 64: custom dropdown (js/ui_dropdown.js) — the list opens UPWARD,
     over the play area, instead of down over the stats bar. */
  .dd { position: relative; display: inline-flex; }
  .dd-btn { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .dd-list { position: absolute; bottom: calc(100% + 4px); right: 0; min-width: 100%;
    background: #1d232c; border: 1px solid #39424f; border-radius: 6px; display: none;
    z-index: 50; max-height: 240px; overflow-y: auto; padding: 2px 0; }
  .dd.open .dd-list { display: block; }
  .dd-opt { display: block; width: 100%; text-align: left; padding: 4px 10px;
    cursor: pointer; white-space: nowrap; font-size: 12px; background: none; border: none; color: #dfe6ee; }
  .dd-opt:hover { background: #2a3342; }
  .dd-opt.sel { color: #ffd76a; }
  #msg { font-size: 14px; color: #8b97a7; min-height: 18px;
    width: 1400px; box-sizing: border-box; } /* Phase 64: play-area width only */
  /* Bottom bar: a full-width bar across the bottom, below the message line.
     Phase 35: ALWAYS visible — it shows the next-wave enemy composition chips
     (swatch + count) while between waves so the player can plan placement,
     and falls back to a Game Stats readout whenever no wave is pending. It
     reserves its space permanently, so nothing shifts when content swaps. */
  #wavePreview { display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    background: #232a35; border: 1px solid #39424f; border-radius: 6px;
    padding: 4px 8px; font-size: 12px; width: 100%; box-sizing: border-box;
    min-height: 24px; }
  #wavePreview .wp-label { color: #ffd76a; font-weight: 600; }
  /* Phase 52: the bar is a two-zone row — #wpLeft holds the existing content
     (wave-composition chips or this level's Stats readout) and #wpTotal the
     all-time stats + reset button, pinned to the right edge. */
  #wpLeft { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #wpTotal { display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    margin-left: auto; }
  .wp-chip { display: flex; gap: 4px; align-items: center; background: #1d232c;
    border-radius: 4px; padding: 2px 6px; }
  .wp-chip .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #wpResetBtn { background: #3a2730; border: 1px solid #6b4152; color: #ffb3c0;
    padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  #wpResetBtn:hover { background: #4a3140; }
  /* Phase 66: ❓ Help button — sits BETWEEN #wpLeft and #wpTotal. Both it and
     #wpTotal carry margin-left:auto, so the free space splits evenly and the
     button stays centered in the gap however wide either zone grows. */
  #helpBtn { margin-left: auto; background: #1f3242; border: 1px solid #33b8ff;
    color: #bfe6ff; padding: 2px 12px; border-radius: 4px; cursor: pointer;
    font-size: 12px; font-weight: 600; }
  #helpBtn:hover { background: #28455c; color: #fff; }
  /* Phase 66: Help modal (js/help.js) — README.MD rendered over the game. */
  #helpOverlay { position: fixed; inset: 0; z-index: 100; display: none;
    background: rgba(8, 10, 14, .72); align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; color: #dfe6ee; }
  #helpOverlay.open { display: flex; }
  #helpOverlay .help-card { width: min(980px, 92%); height: 88%; display: flex;
    flex-direction: column; background: #1b212a; border: 1px solid #ffd76a;
    border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,.6); }
  #helpOverlay .help-head { display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border-bottom: 1px solid #39424f; }
  #helpOverlay .help-title { color: #ffd76a; font-weight: 700; font-size: 15px; }
  #helpOverlay .help-body { flex: 1; overflow-y: auto; padding: 4px 22px 24px;
    font-size: 14px; line-height: 1.55; color: #dfe6ee; outline: none; }
  #helpOverlay .help-body h1 { font-size: 24px; color: #ffd76a; margin: 14px 0 8px; }
  #helpOverlay .help-body h2 { font-size: 19px; color: #ffd76a; margin: 22px 0 8px;
    padding-bottom: 4px; border-bottom: 1px solid #39424f; }
  #helpOverlay .help-body h3 { font-size: 16px; color: #ffe3a3; margin: 16px 0 6px; }
  #helpOverlay .help-body p { margin: 8px 0; }
  #helpOverlay .help-body ul, #helpOverlay .help-body ol { margin: 6px 0; padding-left: 22px; }
  #helpOverlay .help-body li { margin: 4px 0; }
  #helpOverlay .help-body strong { color: #fff; }
  #helpOverlay .help-body a { color: #7fc8ff; }
  #helpOverlay .help-body code { background: #11151b; border: 1px solid #2c3440;
    border-radius: 4px; padding: 0 4px; font-size: 12.5px; }
  #helpOverlay .help-body pre { background: #11151b; padding: 8px; border-radius: 6px; overflow-x: auto; }
  #helpOverlay .help-body img { max-width: 100%; border: 1px solid #39424f; border-radius: 6px; display: block; margin: 6px 0; }
  #helpOverlay .help-body table { border-collapse: collapse; width: 100%; margin: 8px 0; table-layout: fixed; }
  #helpOverlay .help-body td, #helpOverlay .help-body th { vertical-align: top; padding: 4px 6px; font-size: 12.5px; color: #b9c4d2; }
  #helpOverlay .help-body hr { border: none; border-top: 1px solid #39424f; }
  #helpOverlay .help-note { color: #8b97a7; }
  #helpOverlay .help-body .md-center { text-align: center; }
  #helpOverlay .help-body .md-center img { margin: 10px auto; }
  /* Version chip: the app's MAJOR.MINOR (js/config.js GAME_VERSION), pinned to
     the far right of the bottom bar on every page. */
  .version-chip { display: flex; align-items: center; background: #1d232c;
    border-radius: 4px; padding: 2px 6px; color: #8b97a7; font-size: 12px; }
  /* First-time tutorial card: floats top-center over the play area. The
     wrapper is pointer-events:none so it never blocks the canvas/shop; only
     the card itself captures clicks (its buttons). */
  #tutorial { position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
    width: min(420px, 90vw); z-index: 10; pointer-events: none; }
  #tutorial .tut-card { pointer-events: auto; background: #232a35;
    border: 1px solid #ffd76a; border-radius: 8px; padding: 10px 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,.5); font-size: 14px; }
  #tutorial .tut-head { font-weight: 600; color: #ffd76a; margin-bottom: 4px; }
  #tutorial .tut-body { color: #dfe6ee; }
  #tutorial .tut-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  #tutorial .tut-row .tower-btn { padding: 4px 10px; font-size: 13px; }
</style>
</head>
<body>
  <div id="hud">
    <span>💰 <b id="money">0</b></span>
    <span>❤️ <b id="lives">0</b></span>
    <span>🌊 Wave <b id="wave">0</b>/<b id="waveMax">20</b></span>
    <span>🏆 <b id="score">0</b></span>
    <label>🗺️ <select id="levelSelect" class="tower-btn"></select></label>
    <button class="tower-btn" id="nextWaveBtn">Send Next Wave</button>
    <button class="tower-btn" id="showRangesBtn">◎ Ranges</button>
    <button class="tower-btn" id="speedBtn">Speed: 1x</button>
    <button class="tower-btn" id="pauseBtn">▶ Resume</button>
    <button class="tower-btn" id="muteBtn">🔊 SFX</button>
    <button class="tower-btn" id="musicBtn">🎵 Start</button>
    <label>🎚 <select id="diffSelect" class="tower-btn"></select></label>
    <a class="tower-btn" href="levelgen.html" style="text-decoration:none;">🎲 Level Generator</a>
    <a class="tower-btn" href="levels.html" style="text-decoration:none;">📦 Stored Levels</a>
  </div>
  <div id="wrap">
    <div id="legend"></div>
    <canvas id="game" width="1400" height="800"></canvas>
    <div id="side">
      <div id="shop"></div>
    </div>
  </div>
  <div id="msg">Pick a tower, click a grass tile to build, then press ▶ Resume to start.</div>
  <!-- Phase 64: selected-tower detail — constant-height full-width row above
       the stats bar; its dropdowns open upward over the play area. -->
  <div id="towerPanel"></div>
  <!-- Phase 52: two-zone bottom bar — left = wave preview / this level's stats,
       right = all-time (of all time) stats + reset button. -->
  <div id="wavePreview"><div id="wpLeft"></div>
    <button id="helpBtn" title="Player guide (pauses the game)">❓ Help</button>
    <div id="wpTotal"></div>
    <span class="version-chip" id="versionChip">v—</span></div>
  <!-- Classic scripts in dependency order (works from file:// without a server) -->
  <script src="js/config.js"></script>
  <!-- Terrain (pond layout) before assets.js: its auto-init loads the pond
       sprite only when POND_SIZE is defined. -->
  <script src="js/terrain.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/level_validate.js"></script>
  <script src="js/level_registry.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/path.js"></script>
  <!-- Custom levels: the localStorage store (created + imported levels).
       MUST load after path.js — validation needs hasSelfIntersection/sampleSpline.
       MUST load before progress.js — its unlock floor counts stored levels. -->
  <script src="js/level_custom.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/score.js"></script>
  <!-- Phase 52: all-time stats store (loads before game.js/main.js use it). -->
  <script src="js/totalstats.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/tower.js"></script>
  <script src="js/tower_tesla.js"></script>
  <script src="js/tower_warden.js"></script>
  <script src="js/tower_mortar.js"></script>
  <script src="js/tower_cruiser.js"></script>
  <script src="js/projectile.js"></script>
  <script src="js/levelgen_waves.js"></script>
  <script src="js/wave.js"></script>
  <script src="js/sfx_sounds.js"></script>
  <script src="js/sfx.js"></script>
  <!-- Phase 60: background music — real audio files (assets/music/*.ogg) via
       HTMLAudioElement. Roster data first, then the engine. -->
  <script src="js/music_files.js"></script>
  <script src="js/music.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <!-- Phase 62: bottom-bar rendering (BottomBar) — loaded before ui.js, which
       keeps thin delegating methods for main.js's per-frame calls. -->
  <script src="js/ui_bottombar.js"></script>
  <!-- Phase 64: custom upward-opening dropdown (used by the tower panel). -->
  <script src="js/ui_dropdown.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tutorial.js"></script>
  <!-- Phase 66: ❓ Help modal (README.MD rendered in-game). -->
  <script src="js/help.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
  <!-- Phase 53: windowed-mode fit — scales the whole page down (never up) to
       fit smaller browser windows. Page chrome only; loads last, after main. -->
  <script src="js/fit.js"></script>
  <script>
    // Version chip: show GAME_VERSION (js/config.js) in the bottom bar.
    document.getElementById('versionChip').textContent = 'v' + GAME_VERSION;
  </script>
</body>
</html>
